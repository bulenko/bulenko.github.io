// Универсальная функция для случайного перемешивания массива (Фишер-Йетс)
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

    document.getElementById('score-container').style.display = 'none';
    
    showQuestion();
}

    let currentQuestion = currentQuestions[currentQuestionIndex];
    questionText.textContent = `Вопрос ${currentQuestionIndex + 1}: ${currentQuestion.question}`;
    
    // Перемешиваем ВАРИАНТЫ ОТВЕТОВ конкретно для этого вопроса
    let shuffledAnswers = shuffle([...currentQuestion.answers]);
    
    // Создаем кнопки для каждого варианта
    shuffledAnswers.forEach(answer => {
        const button = document.createElement('button');
        button.innerText = answer;
        button.classList.add('btn');
        button.onclick = () => checkAnswer(answer, currentQuestion.correct);
        optionsContainer.appendChild(button);
    });
}

function checkAnswer(userAnswer, correctAnswer) {
    if (userAnswer === correctAnswer) {
        score++;
    }
    
    currentQuestionIndex++;
    
    if (currentQuestionIndex < currentQuestions.length) {
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-inner').style.display = 'none';
    document.getElementById('score-container').style.display = 'block';
    document.getElementById('final-score').textContent = score;
    document.getElementById('total-questions').textContent = currentQuestions.length;
}

// Запуск при загрузке страницы
startQuiz();
</script>

</body>
</html>
