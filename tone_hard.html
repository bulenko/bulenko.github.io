<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тест: Знаки при ключе — мажор и минор</title>
<style>
:root{--bg:#f0f3f5;--card:#fff;--text:#2c3e50;--muted:#7f8c8d;--border:#e0e4e8;--accent:#3498db;--accent-hover:#2980b9;--correct:#2ecc71;--wrong:#e74c3c;--next-bg:#2c3e50;--shadow:0 4px 20px rgba(0,0,0,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#1a1d21;--card:#24282d;--text:#e8eaed;--muted:#9aa0a6;--border:#3a3f45;--accent:#4aa8e8;--accent-hover:#5cb6f0;--correct:#34d17a;--wrong:#f0554b;--next-bg:#3a3f45;--shadow:0 4px 20px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
body{display:flex;justify-content:center;align-items:flex-start;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)) 12px}
.box{background:var(--card);width:100%;max-width:560px;padding:clamp(16px,4vw,28px);border-radius:16px;box-shadow:var(--shadow)}
h1{margin:0 0 6px;font-size:clamp(17px,4.5vw,21px);text-align:center;line-height:1.25}
.subtitle{display:block;font-size:.8em;color:var(--muted);font-weight:400}
#progress{text-align:center;color:var(--muted);font-size:clamp(13px,3.5vw,15px);margin-bottom:8px}
.progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:16px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--correct));border-radius:3px;transition:width .35s ease}
.question-card{background:linear-gradient(135deg,rgba(52,152,219,.1),rgba(46,204,113,.08));border:2px solid var(--accent);border-radius:14px;padding:clamp(18px,5vw,28px) 16px;margin:0 0 18px;text-align:center}
.q-label{font-size:clamp(12px,3.2vw,14px);color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.q-name{font-size:clamp(19px,5.2vw,26px);font-weight:700;line-height:1.3}
.q-hint{font-size:clamp(12px,3.2vw,14px);color:var(--muted);margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.sign-btn{width:100%;min-height:48px;padding:10px 6px;border:2px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;cursor:pointer;font-size:clamp(12px,3.4vw,14px);font-weight:600;line-height:1.2;transition:all .15s;font-family:inherit;touch-action:manipulation;position:relative}
.sign-btn:hover:not(:disabled){border-color:var(--accent)}
.sign-btn:active:not(:disabled){transform:scale(.97)}
.sign-btn.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.sign-btn.selected::after{content:"✓";position:absolute;top:2px;right:6px;font-size:12px}
.sign-btn:disabled{cursor:default}
.sign-btn.correct{background:var(--correct)!important;color:#fff!important;border-color:var(--correct)!important}
.sign-btn.wrong{background:var(--wrong)!important;color:#fff!important;border-color:var(--wrong)!important}
.sign-btn.missed{background:rgba(46,204,113,.2)!important;border-color:var(--correct)!important;border-style:dashed}
#feed{font-weight:700;text-align:center;margin:12px 0;min-height:24px;font-size:clamp(14px,3.8vw,16px)}
.btn-primary{width:100%;min-height:54px;background:var(--accent);color:#fff;border:none;font-size:clamp(15px,4vw,17px);border-radius:10px;cursor:pointer;font-weight:700;font-family:inherit;touch-action:manipulation;transition:background .15s,transform .05s}
.btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn-primary:active:not(:disabled){transform:scale(.97)}
.btn-next{width:100%;min-height:54px;background:var(--next-bg);color:#fff;border:none;font-size:clamp(15px,4vw,17px);border-radius:10px;cursor:pointer;font-weight:700;font-family:inherit;display:none;touch-action:manipulation;margin-top:10px}
#finalScreen{display:none;text-align:center;padding:10px 0}
#finalScreen.visible{display:block}
#finalScreen .medal{font-size:clamp(48px,14vw,72px);line-height:1;margin-bottom:8px}
#finalScreen h2{font-size:clamp(20px,5.5vw,26px);margin:8px 0}
#finalScreen h3{font-size:clamp(16px,4.5vw,20px);color:var(--accent);margin:12px 0 8px}
#finalScreen .best-score{color:var(--muted);font-size:clamp(13px,3.5vw,15px);margin-bottom:24px}
.btn-secondary{width:100%;min-height:50px;background:transparent;color:var(--accent);border:2px solid var(--accent);font-size:clamp(14px,3.8vw,16px);border-radius:10px;cursor:pointer;font-weight:600;font-family:inherit;margin-top:10px;touch-action:manipulation}
.btn-secondary:hover{background:var(--accent);color:#fff}
.btn-secondary:active{transform:scale(.97)}
.mode-title{text-align:center;font-size:clamp(14px,3.8vw,16px);color:var(--muted);margin:0 0 18px}
</style>
</head>
<body>
<div class="box">

<!-- ЭКРАН ВЫБОРА РЕЖИМА -->
<div id="modeScreen">
<h1>Знаки при ключе<span class="subtitle">выберите режим тренировки</span></h1>
<p class="mode-title">В вопросе будет показана тональность. Нужно нажать все знаки, которые стоят при ключе.</p>
<button class="btn-primary" id="modeMajor" style="margin-bottom:10px;">🎼 Только мажор</button>
<button class="btn-primary" id="modeMinor" style="margin-bottom:10px;">🎵 Только минор</button>
<button class="btn-primary" id="modeAll">🎶 Мажор и минор вместе</button>
</div>

<!-- ИГРОВОЙ ЭКРАН -->
<div id="gameScreen" style="display:none;">
<h1 id="gameTitle">Знаки при ключе</h1>
<div id="progress">Вопрос 1 из 15</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="question-card">
<div class="q-label">Тональность</div>
<div class="q-name" id="qName"></div>
</div>
<div class="grid" id="options"></div>
<div id="feed"></div>
<button class="btn-primary" id="checkBtn">Проверить</button>
<button class="btn-next" id="nextBtn">Дальше →</button>
</div>

<!-- ФИНАЛЬНЫЙ ЭКРАН -->
<div id="finalScreen">
<div class="medal" id="finalMedal">🎵</div>
<h2 id="finalMessage"></h2>
<h3 id="finalScore"></h3>
<div class="best-score" id="finalBest"></div>
<button class="btn-primary" id="restart" style="margin-bottom:10px;">Пройти заново</button>
<button class="btn-secondary" id="backToMode">Выбрать другой режим</button>
</div>

</div>

<script>
(function(){
"use strict";

var SHARP_ORDER=["Фа-диез","До-диез","Соль-диез","Ре-диез","Ля-диез","Ми-диез","Си-диез"];
var FLAT_ORDER=["Си-бемоль","Ми-бемоль","Ля-бемоль","Ре-бемоль","Соль-бемоль","До-бемоль","Фа-бемоль"];

var majorKeys=[
{name:"До мажор",names:[]},
{name:"Соль мажор",names:["Фа-диез"]},
{name:"Ре мажор",names:["Фа-диез","До-диез"]},
{name:"Ля мажор",names:["Фа-диез","До-диез","Соль-диез"]},
{name:"Ми мажор",names:["Фа-диез","До-диез","Соль-диез","Ре-диез"]},
{name:"Си мажор",names:["Фа-диез","До-диез","Соль-диез","Ре-диез","Ля-диез"]},
{name:"Фа-диез мажор",names:["Фа-диез","До-диез","Соль-диез","Ре-диез","Ля-диез","Ми-диез"]},
{name:"До-диез мажор",names:["Фа-диез","До-диез","Соль-диез","Ре-диез","Ля-диез","Ми-диез","Си-диез"]},
{name:"Фа мажор",names:["Си-бемоль"]},
{name:"Си-бемоль мажор",names:["Си-бемоль","Ми-бемоль"]},
{name:"Ми-бемоль мажор",names:["Си-бемоль","Ми-бемоль","Ля-бемоль"]},
{name:"Ля-бемоль мажор",names:["Си-бемоль","Ми-бемоль","Ля-бемоль","Ре-бемоль"]},
{name:"Ре-бемоль мажор",names:["Си-бемоль","Ми-бемоль","Ля-бемоль","Ре-бемоль","Соль-бемоль"]},
{name:"Соль-бемоль мажор",names:["Си-бемоль","Ми-бемоль","Ля-бемоль","Ре-бемоль","Соль-бемоль","До-бемоль"]},
{name:"До-бемоль мажор",names:["Си-бемоль","Ми-бемоль","Ля-бемоль","Ре-бемоль","Соль-бемоль","До-бемоль","Фа-бемоль"]}
];

var minorKeys=[
{name:"Ля минор",names:[]},
{name:"Ми минор",names:["Фа-диез"]},
{name:"Си минор",names:["Фа-диез","До-диез"]},
{name:"Фа-диез минор",names:["Фа-диез","До-диез","Соль-диез"]},
{name:"До-диез минор",names:["Фа-диез","До-диез","Соль-диез","Ре-диез"]},
{name:"Соль-диез минор",names:["Фа-диез","До-диез","Соль-диез","Ре-диез","Ля-диез"]},
{name:"Ре-диез минор",names:["Фа-диез","До-диез","Соль-диез","Ре-диез","Ля-диез","Ми-диез"]},
{name:"Ля-диез минор",names:["Фа-диез","До-диез","Соль-диез","Ре-диез","Ля-диез","Ми-диез","Си-диез"]},
{name:"Ре минор",names:["Си-бемоль"]},
{name:"Соль минор",names:["Си-бемоль","Ми-бемоль"]},
{name:"До минор",names:["Си-бемоль","Ми-бемоль","Ля-бемоль"]},
{name:"Фа минор",names:["Си-бемоль","Ми-бемоль","Ля-бемоль","Ре-бемоль"]},
{name:"Си-бемоль минор",names:["Си-бемоль","Ми-бемоль","Ля-бемоль","Ре-бемоль","Соль-бемоль"]},
{name:"Ми-бемоль минор",names:["Си-бемоль","Ми-бемоль","Ля-бемоль","Ре-бемоль","Соль-бемоль","До-бемоль"]},
{name:"Ля-бемоль минор",names:["Си-бемоль","Ми-бемоль","Ля-бемоль","Ре-бемоль","Соль-бемоль","До-бемоль","Фа-бемоль"]}
];

var STORAGE_PREFIX="key_signature_mode_";
var ALL_BUTTONS=SHARP_ORDER.concat(FLAT_ORDER).concat(["__NONE__"]);

var gamePool=[],current=0,score=0,locked=false,selectedNames=[],currentMode="";

var $modeScreen=document.getElementById("modeScreen");
var $gameScreen=document.getElementById("gameScreen");
var $finalScreen=document.getElementById("finalScreen");
var $gameTitle=document.getElementById("gameTitle");
var $progress=document.getElementById("progress");
var $progressFill=document.getElementById("progressFill");
var $qName=document.getElementById("qName");
var $options=document.getElementById("options");
var $feed=document.getElementById("feed");
var $checkBtn=document.getElementById("checkBtn");
var $nextBtn=document.getElementById("nextBtn");
var $finalMedal=document.getElementById("finalMedal");
var $finalMessage=document.getElementById("finalMessage");
var $finalScore=document.getElementById("finalScore");
var $finalBest=document.getElementById("finalBest");
var $restart=document.getElementById("restart");
var $backToMode=document.getElementById("backToMode");

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function vibrate(p){if("vibrate" in navigator){try{navigator.vibrate(p);}catch(e){}}}
function getBest(mode){var v=parseInt(localStorage.getItem(STORAGE_PREFIX+mode)||"0",10);return isNaN(v)?0:v;}
function setBest(mode,v){try{localStorage.setItem(STORAGE_PREFIX+mode,String(v));}catch(e){}}

function start(mode){
currentMode=mode;
if(mode==="major"){gamePool=shuffle(majorKeys);$gameTitle.textContent="Мажорные тональности";}
else if(mode==="minor"){gamePool=shuffle(minorKeys);$gameTitle.textContent="Минорные тональности";}
else{gamePool=shuffle(majorKeys.concat(minorKeys));$gameTitle.textContent="Мажор и минор";}
current=0;score=0;locked=false;
$modeScreen.style.display="none";
$finalScreen.classList.remove("visible");
$gameScreen.style.display="block";
show();
}

function show(){
locked=false;
selectedNames=[];
var q=gamePool[current];
$progress.textContent="Вопрос "+(current+1)+" из "+gamePool.length;
$progressFill.style.width=((current/gamePool.length)*100)+"%";
$qName.textContent=q.name;
$feed.textContent="";
$nextBtn.style.display="none";
$checkBtn.style.display="block";
$checkBtn.disabled=false;

$options.innerHTML="";
for(var i=0;i<ALL_BUTTONS.length;i++){
(function(name){
var btn=document.createElement("button");
btn.type="button";
btn.className="sign-btn";
btn.textContent=name==="__NONE__"?"Нет знаков":name;
btn.dataset.name=name;
btn.addEventListener("click",function(){
if(locked)return;
if(name==="__NONE__"){
var isSel=btn.classList.contains("selected");
var all=document.querySelectorAll(".sign-btn");
for(var a=0;a<all.length;a++)all[a].classList.remove("selected");
selectedNames=[];
if(!isSel){btn.classList.add("selected");selectedNames=["__NONE__"];}
}else{
var noneBtn=document.querySelector('.sign-btn[data-name="__NONE__"]');
if(noneBtn&&noneBtn.classList.contains("selected")){
noneBtn.classList.remove("selected");
selectedNames=[];
}
var isSel=btn.classList.contains("selected");
if(isSel){
btn.classList.remove("selected");
var idx=selectedNames.indexOf(name);
if(idx>=0)selectedNames.splice(idx,1);
}else{
btn.classList.add("selected");
selectedNames.push(name);
}
}
});
$options.appendChild(btn);
})(ALL_BUTTONS[i]);
}
}

function check(){
if(locked)return;
if(selectedNames.length===0){
$feed.textContent="Выберите хотя бы один вариант";
$feed.style.color="var(--muted)";
return;
}
locked=true;

var q=gamePool[current];
var correct=q.names.slice();
if(correct.length===0)correct=["__NONE__"];

var selSet={};
for(var i=0;i<selectedNames.length;i++)selSet[selectedNames[i]]=true;
var corSet={};
for(var j=0;j<correct.length;j++)corSet[correct[j]]=true;

var isCorrect=true;
for(var k in selSet){if(!corSet[k]){isCorrect=false;break;}}
if(isCorrect){for(var m in corSet){if(!selSet[m]){isCorrect=false;break;}}}

var buttons=document.querySelectorAll(".sign-btn");
for(var b=0;b<buttons.length;b++)buttons[b].disabled=true;

if(isCorrect){
$feed.textContent="🎉 Верно!";
$feed.style.color="var(--correct)";
score++;vibrate(50);
for(var x=0;x<buttons.length;x++){
if(selSet[buttons[x].dataset.name])buttons[x].classList.add("correct");
}
}else{
vibrate([40,60,40]);
for(var y=0;y<buttons.length;y++){
var nm=buttons[y].dataset.name;
if(selSet[nm]&&!corSet[nm])buttons[y].classList.add("wrong");
else if(!selSet[nm]&&corSet[nm])buttons[y].classList.add("missed");
else if(selSet[nm]&&corSet[nm])buttons[y].classList.add("correct");
}
var correctText=correct[0]==="__NONE__"?"Нет знаков":correct.join(", ");
$feed.textContent="❌ Неверно. Правильно: "+correctText;
$feed.style.color="var(--wrong)";
}

$checkBtn.style.display="none";
$nextBtn.style.display="block";
}

function nextQuestion(){current++;if(current<gamePool.length)show();else finish();}

function finish(){
$progressFill.style.width="100%";
var best=getBest(currentMode);
var total=gamePool.length;
var pct=score/total;
var medal="🎵",message="Хорошее начало!";
if(score===total){medal="🏆";message="Идеально! Вы знаток тональностей!";}
else if(pct>=0.85){medal="🥇";message="Отличный результат!";}
else if(pct>=0.65){medal="🥈";message="Хорошо, но есть куда расти.";}
else if(pct>=0.4){medal="🥉";message="Неплохо, потренируйтесь ещё.";}
var isNewBest=score>best;if(isNewBest)setBest(currentMode,score);
$finalMedal.textContent=medal;
$finalMessage.textContent=message;
$finalScore.textContent=score+" из "+total;
$finalBest.textContent=isNewBest?"🎉 Новый рекорд!":"Лучший результат: "+best+" из "+total;
$gameScreen.style.display="none";
$finalScreen.classList.add("visible");
}

document.getElementById("modeMajor").addEventListener("click",function(){vibrate(20);start("major");});
document.getElementById("modeMinor").addEventListener("click",function(){vibrate(20);start("minor");});
document.getElementById("modeAll").addEventListener("click",function(){vibrate(20);start("all");});

$checkBtn.addEventListener("click",check);
$nextBtn.addEventListener("click",nextQuestion);
$restart.addEventListener("click",function(){vibrate(30);start(currentMode);});
$backToMode.addEventListener("click",function(){
$finalScreen.classList.remove("visible");
$gameScreen.style.display="none";
$modeScreen.style.display="block";
});
})();
</script>
</body>
</html>
